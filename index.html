<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Student Report</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;padding:40px 16px}
  .card{max-width:460px;margin:auto;background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}
  button,.btn{display:inline-flex;align-items:center;gap:10px;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:12px 22px;font-size:15px;cursor:pointer;text-decoration:none}
  button:disabled{background:#9bb8e8;cursor:default}
  .btn.secondary{background:#fff;color:#1a73e8;border:1px solid #1a73e8;margin-top:14px}
  #msg{margin-top:18px;color:#333;min-height:1.2em}
  .hint{color:#777;font-size:13px}
  details{margin-top:18px;text-align:left;font-size:12px;color:#668}
  details pre{white-space:pre-wrap;word-break:break-all;background:#f6f6f6;padding:8px;border-radius:4px}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  .hidden{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="card">
  <h2 id="title">Student Report</h2>
  <p id="info">Checking your link, one moment…</p>
  <button id="btn" disabled><span id="spin" class="spinner"></span><span id="label">Checking link…</span></button>
  <div id="msg"></div>
  <a id="fallback" class="btn secondary hidden" target="_top">Open the report page directly</a>
  <details id="tech" class="hidden"><summary>Technical details (for the school)</summary><pre id="techText"></pre></details>
</div>
<script>
  // Must be the CURRENT deployment's /exec URL (Deploy → Manage deployments)
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycby1qWG4SxKBRfxv7FUY1-kjBMxbaDIY-jYtercnipBAPLZBvtQ-ZH6na8ASfWvj9YRy/exec';
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id);

  function setButton(label, enabled, spinning) {
    $('label').textContent = label;
    $('btn').disabled = !enabled;
    $('spin').classList.toggle('hidden', !spinning);
  }

  function showTech(text) {
    $('techText').textContent =
      text + '\n\nService: …' + EXEC_URL.slice(-20) + '\nTime: ' + new Date().toString();
    $('tech').classList.remove('hidden');
  }

  function showFallback() {
    if (!token) return;
    $('fallback').href = EXEC_URL + '?t=' + encodeURIComponent(token);
    $('fallback').classList.remove('hidden');
  }

  // Returns parsed JSON, or throws an Error with .kind describing what went wrong
  async function call(action, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    let resp, text;
    try {
      resp = await fetch(EXEC_URL, {
        method: 'POST',
        credentials: 'omit',                       // no Google cookies -> no multi-account bug
        headers: { 'Content-Type': 'text/plain' }, // avoids CORS preflight
        body: JSON.stringify({ action, t: token }),
        signal: ctrl.signal
      });
      text = await resp.text();
    } catch (e) {
      const err = new Error(e.name === 'AbortError' ? 'Request timed out' : 'Network/CORS failure: ' + e.message);
      err.kind = e.name === 'AbortError' ? 'timeout' : 'unreachable';
      throw err;
    } finally {
      clearTimeout(timer);
    }
    try {
      return JSON.parse(text);
    } catch (e) {
      const err = new Error('HTTP ' + resp.status + ', non-JSON response:\n' + text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 300));
      err.kind = /Script function not found/i.test(text) ? 'nodopost' : 'badresponse';
      throw err;
    }
  }

  const FRIENDLY = {
    unreachable: 'The report service could not be reached. It may be offline or its sharing settings may have changed. Please try the button below, or contact the school.',
    timeout:     'The report service is taking too long to respond. Please try again in a few minutes.',
    nodopost:    'The report service is not fully set up yet. Please contact the school.',
    badresponse: 'The report service returned an unexpected response. Please contact the school.'
  };

  if (!token) {
    $('title').textContent = 'Link incomplete';
    $('info').textContent = 'This page needs the full link from your email. Please click the link in the email again, or copy the whole link into your browser.';
    $('btn').classList.add('hidden');
  } else {
    call('info', 30000).then(r => {
      if (!r.ok) {
        $('title').textContent = 'Link unavailable';
        $('info').textContent = r.msg;
        $('btn').classList.add('hidden');
        return;
      }
      $('info').innerHTML = '';
      $('info').append('Report for ', Object.assign(document.createElement('b'), { textContent: r.student }),
        '. Click below and the PDF will be emailed to ', Object.assign(document.createElement('b'), { textContent: r.masked }), '.');
      setButton('Email me the report', true, false);
    }).catch(err => {
      $('info').textContent = FRIENDLY[err.kind] || FRIENDLY.badresponse;
      setButton('Unavailable', false, false);
      showTech(err.message);
      if (err.kind === 'unreachable') showFallback();
    });
  }

  $('btn').onclick = () => {
    setButton('Preparing report…', false, true);
    $('msg').innerHTML = '<span class="hint">This can take up to a minute. Please keep this page open.</span>';
    call('send', 120000).then(r => {
      $('msg').textContent = r.msg;
      if (r.ok) setButton('Report sent ✓', false, false);
      else setButton('Try again', true, false);
    }).catch(err => {
      $('msg').textContent = FRIENDLY[err.kind] || FRIENDLY.badresponse;
      setButton('Try again', true, false);
      showTech(err.message);
    });
  };
</script>
</body></html>
