<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Student Report</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;padding:40px 16px}
  .card{max-width:460px;margin:auto;background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}
  button{display:inline-flex;align-items:center;gap:10px;background:#1a73e8;color:#fff;border:0;border-radius:6px;padding:12px 22px;font-size:15px;cursor:pointer}
  button:disabled{background:#9bb8e8;cursor:default}
  #msg{margin-top:18px;color:#333;min-height:1.2em}
  .hint{color:#777;font-size:13px}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  .hidden{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="card">
  <h2 id="title">Student Report</h2>
  <p id="info">Checking your link, one moment…</p>
  <button id="btn" disabled><span id="spin" class="spinner"></span><span id="label">Checking link…</span></button>
  <div id="msg"></div>
</div>
<script>
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycby1qWG4SxKBRfxv7FUY1-kjBMxbaDIY-jYtercnipBAPLZBvtQ-ZH6na8ASfWvj9YRy/exec';
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id);

  function setButton(label, enabled, spinning) {
    $('label').textContent = label;
    $('btn').disabled = !enabled;
    $('spin').classList.toggle('hidden', !spinning);
  }

  function call(action) {
    return fetch(EXEC_URL, {
      method: 'POST',
      credentials: 'omit',                       // no Google cookies -> no multi-account bug
      headers: { 'Content-Type': 'text/plain' }, // avoids CORS preflight
      body: JSON.stringify({ action, t: token })
    }).then(r => r.json());
  }

  call('info').then(r => {
    if (!r.ok) {
      $('title').textContent = 'Link unavailable';
      $('info').textContent = r.msg;
      $('btn').classList.add('hidden');
      return;
    }
    $('info').innerHTML = '';
    $('info').append('Report for ', Object.assign(document.createElement('b'), { textContent: r.student }),
      '. Click below and the PDF will be emailed to ', Object.assign(document.createElement('b'), { textContent: r.masked }), '.');
    setButton('Email me the report', true, false);
  }).catch(() => {
    $('info').textContent = 'Could not load. Please refresh the page or try again later.';
    setButton('Unavailable', false, false);
  });

  $('btn').onclick = () => {
    setButton('Preparing report…', false, true);
    $('msg').innerHTML = '<span class="hint">This can take up to a minute. Please keep this page open.</span>';
    call('send').then(r => {
      $('msg').textContent = r.msg;
      if (r.ok) setButton('Report sent ✓', false, false);
      else setButton('Try again', true, false);
    }).catch(() => {
      $('msg').textContent = 'Something went wrong. Please try again.';
      setButton('Try again', true, false);
    });
  };
</script>
</body></html>
